[project]
name = "supplier-price-watch"
version = "0.1.0"
description = "Catch quiet supplier price increases and new surcharges from your invoices, with Claude."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fanny Rabinovitch" }]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
